# 每天从公开看板生成 README 使用统计图，强制推送到独立的 usage-stats 分支，不在 main 上产生提交。
name: Usage stats card

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: usage-stats
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render SVG
        run: |
          mkdir -p out
          python3 Scripts/usage-stats-svg.py out/usage-stats.svg
      - name: Publish to usage-stats branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b usage-stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add usage-stats.svg
          git commit -q -m "更新使用统计图"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" usage-stats
